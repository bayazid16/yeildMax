# Single-container deployment: Nginx serves the built React SPA and proxies
# API/admin traffic to the Django process listening on 127.0.0.1:8000.
server {
    listen 80;
    server_name _;

    root /var/www/yieldmax;
    index index.html;

    client_max_body_size 25M;

    # Django REST API (V1 + V2)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django admin (optional)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Collected Django admin/DRF static files
    location /static/ {
        alias /var/www/static/;
    }

    # React Router / Vite SPA fallback.
    # Every client-side route (/, /farm-map, /soil-weather,
    # /satellite-ndvi, /crop-suitability, ...) serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
