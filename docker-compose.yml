services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yieldmax_db
      POSTGRES_USER: yieldmax_user
      POSTGRES_PASSWORD: yieldmax_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yieldmax_user -d yieldmax_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yieldmax_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - yieldmax_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: yieldmax_db
      DB_USER: yieldmax_user
      DB_PASSWORD: yieldmax_pass
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: "${SECRET_KEY:-django-insecure-+1pe*olh+ez8d*&(_z-__993tuz4mz_gwg%d0($}"
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      REDIS_URL: "redis://redis:6379/0"
      # LLM API Keys - safe empty defaults so the app never crashes without them
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # Model selection. Gemini 3.5 Flash-Lite is fast and cost-effective.
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-3.5-turbo}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-30}"
    ports:
      # Exposed for the Vite dev server proxy (frontend/vite.config.ts)
      - "8001:8000"
    networks:
      - yieldmax_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "celery -A config worker --loglevel=info --concurrency=2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: yieldmax_db
      DB_USER: yieldmax_user
      DB_PASSWORD: yieldmax_pass
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: "${SECRET_KEY:-django-insecure-+1pe*olh+ez8d*&(_z-__993tuz4mz_gwg%d0($}"
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      REDIS_URL: "redis://redis:6379/0"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-3.5-turbo}"
    networks:
      - yieldmax_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Access the app at http://localhost:8080
      - "8080:80"
    networks:
      - yieldmax_net

volumes:
  pg_data:
  redis_data:

networks:
  yieldmax_net:
    driver: bridge
